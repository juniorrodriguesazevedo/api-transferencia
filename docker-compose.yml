services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: wallet_app
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - wallet-network

  nginx:
    image: nginx:alpine
    container_name: wallet_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - wallet-network

  mysql:
    image: mysql:8.0
    container_name: wallet_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wallet
      MYSQL_USER: wallet
      MYSQL_PASSWORD: wallet
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wallet-network

volumes:
  mysql_data:

networks:
  wallet-network:
    driver: bridge
